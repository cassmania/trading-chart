<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#f5f4ee"/>
<title>트레이딩 챠트</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css?v=20261025"/>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true">✦</span><span>트레이딩 챠트</span></div>

  <form class="search" id="symForm" autocomplete="off">
    <input id="symInput" list="symList" spellcheck="false" placeholder="심볼 (BTC, ETH, KRW-XRP)" aria-label="심볼"/>
    <datalist id="symList"></datalist>
    <button type="submit">조회</button>
  </form>

  <div class="seg" id="tfSeg" role="group" aria-label="시간봉">
    <button data-tf="m15">15분</button><button data-tf="h1">1시간</button><button data-tf="h4">4시간</button><button data-tf="h12">12시간</button><button data-tf="D">일</button><button data-tf="W">주</button><button data-tf="M">월</button>
  </div>

  <div class="seg" id="quoteSeg" role="group" aria-label="마켓">
    <button data-q="USDT">USDT</button><button data-q="KRW">KRW</button>
  </div>

  <div class="seg" id="modeSeg" role="group" aria-label="매매 방식" title="롱만: 현물 기준 매수→매도 / 롱·숏: 선물 기준 양방향">
    <button data-m="long">롱만</button><button data-m="both">롱·숏</button>
  </div>

  <button class="icon" id="themeBtn" title="라이트/다크 전환" aria-label="테마 전환"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>

<main class="layout">
  <section class="chart-area">
    <div class="legend" id="legend">
      <div class="lg-row1"><b id="lgSym">—</b><span class="badge" id="lgExch">—</span><span id="lgTf"></span><span class="live" id="liveDot" title="실시간 연결 상태"></span></div>
      <div class="lg-row2" id="lgOhlc"></div>
      <div class="lg-row3" id="lgInd"></div>
    </div>
    <div class="chart" id="chartMain"></div>
    <div class="osc-head" id="oscHead"></div>
    <div class="chart osc" id="chartOsc"></div>
    <div class="loading hidden" id="loading"><span class="spinner"></span><span id="loadingText">불러오는 중…</span></div>
  </section>

  <aside class="side">
    <section class="card price-card">
      <div class="pc-top"><span id="pcName">—</span><span class="muted" id="pcSrc"></span></div>
      <div class="pc-price" id="pcPrice">—</div>
      <div class="pc-sub"><span id="pcChg">—</span><span class="muted" id="pcKrw"></span></div>
    </section>

    <section class="card signal-card" id="signalCard">
      <div class="card-head"><h2>현재 판단</h2><span class="pill" id="sigConf">—</span></div>
      <div class="sig-main" id="sigMain">분석 대기</div>
      <div class="sig-why muted" id="sigWhy"></div>
      <dl class="levels" id="sigLevels"></dl>
    </section>

    <section class="card">
      <div class="card-head"><h2>시장 국면</h2><span class="pill neutral" id="regName">—</span></div>
      <dl class="kv" id="regKv"></dl>
    </section>

    <section class="card">
      <div class="card-head"><h2>자동 적용 지표</h2><button class="link" id="autoBtn">자동으로 되돌리기</button></div>
      <p class="muted small" id="autoDesc"></p>
      <table class="tbl" id="selTbl"></table>
      <div class="wf" id="wfBox"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>지표 백테스트 순위</h2><span class="muted small" id="btMeta"></span></div>
      <p class="muted small">행을 누르면 해당 지표와 매매 타점을 차트에 적용합니다. 순위는 검증 구간(최근 60%) 점수 기준입니다.</p>
      <div class="tbl-wrap"><table class="tbl rank" id="rankTbl"></table></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>관심종목</h2></div>
      <form class="watch-add" id="watchForm" autocomplete="off"><input id="watchInput" placeholder="심볼 추가" spellcheck="false" aria-label="관심종목 추가"/><button type="submit">추가</button></form>
      <ul class="watch" id="watchList"></ul>
    </section>

    <p class="disclaimer">백테스트는 과거 데이터에 대한 결과이며 미래 수익을 보장하지 않습니다. 수수료 0.1%·손절 2.5×ATR·다음 봉 시가 체결 기준으로 계산합니다. 투자 판단의 책임은 본인에게 있습니다.</p>
  </aside>
</main>

<div class="toast hidden" id="toast" role="status"></div>

<script src="vendor/lightweight-charts.js"></script>
<script src="engine.js?v=20261025"></script>
<script src="app.js?v=20261025"></script>
</body>
</html>
